body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 12% -8%,var(--surface2) 0,rgba(255,253,248,0) 46%),radial-gradient(circle at 92% 4%,var(--bg2) 0,rgba(241,239,230,0) 40%);
  background-attachment:fixed;
}
.serif{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",Georgia,"Times New Roman",serif}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);text-decoration:none}
/* ---------- 布局 ---------- */
.app{display:flex;align-items:flex-start;min-height:100vh}
.rail{
  position:sticky;top:0;flex:0 0 218px;width:218px;height:100vh;
  padding:26px 18px 18px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface) 0%,var(--bg2) 60%,var(--bg) 100%);
  display:flex;flex-direction:column;gap:18px;
}
.main{flex:1;min-width:0;padding:30px 34px 90px;max-width:1180px}
.view{display:none}
.view.on{display:block;animation:viewIn .26s ease both}
@keyframes viewIn{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:9px}
.blogo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff}
.btxt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.btxt b{font-size:16px;font-weight:600;letter-spacing:.02em}
.btxt i{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.dot{margin-left:auto;font-size:10px;letter-spacing:.08em;color:var(--sage);border:1px solid var(--line);background:var(--sagebg);border-radius:20px;padding:2px 7px;white-space:nowrap}
.dot.warn{color:var(--red);border-color:var(--badbd);background:var(--warnbg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;min-height:40px;
  padding:8px 10px;border-radius:9px;color:var(--ink2);font-size:14.5px;text-align:left;
  transition:background .16s,color .16s;
}
.nav button svg{flex:0 0 auto;opacity:.72}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--onink)}
.nav button.on svg{opacity:1}
.nav .badge{margin-left:auto;font-size:11px;min-width:19px;height:19px;line-height:19px;text-align:center;border-radius:10px;background:var(--accentsoft);color:var(--accent);padding:0 5px}
.nav button.on .badge{background:rgba(255,255,255,.2);color:#fff}
.rfoot{margin-top:auto;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:14px}
.tiny{font-size:11.5px;color:var(--ink3);line-height:1.5}
/* ---------- 标题区 ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:24px}
.kicker{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.stitle{font-size:27px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.sday{font-size:13px;color:var(--ink3);margin-top:5px}
.hact{display:flex;gap:8px;flex-wrap:wrap}
h3.blk{font-size:15px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
h3.blk .n{font-size:11px;color:var(--ink4);letter-spacing:.14em}
.sub{font-size:12.5px;color:var(--ink3)}
/* ---------- 容器 ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--sh)}
.panel.flat{background:transparent;border:0;box-shadow:none;padding:0}
.panel.tint{background:linear-gradient(180deg,var(--surface),var(--surface2))}
.panel + .panel,.blk + .blk{margin-top:16px}
.blk{margin-bottom:16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gsplit{display:grid;grid-template-columns:330px 1fr;gap:16px}
.gsplit2{display:grid;grid-template-columns:1fr 300px;gap:16px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hair{height:1px;background:var(--line2);margin:14px 0}
/* ---------- 统计数字 ---------- */
.stat{padding:2px 0}
.stat .lb{font-size:11.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.stat .vl{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin-top:2px}
.stat .vl small{font-size:13px;font-weight:400;color:var(--ink3);margin-left:3px}
.stat .df{font-size:12px;color:var(--ink3);margin-top:1px}
.statset{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 18px}
.statset > div{border-left:1px solid var(--line);padding-left:14px}
.statset > div:first-child{border-left:0;padding-left:0}
.red{color:var(--red)} .green{color:var(--green)} .ink3{color:var(--ink3)}
/* ---------- 列表 ---------- */
.rows{border-top:1px solid var(--line2)}
.rw{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2)}
.rw:hover{background:var(--hover)}
.rw .gr{flex:1;min-width:0}
.rw .t1{font-size:14.5px;line-height:1.4;word-break:break-word}
.rw .t2{font-size:12px;color:var(--ink3);margin-top:2px;word-break:break-word}
.rw .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rw.done .t1{color:var(--ink4);text-decoration:line-through}
.rw.ovd{background:var(--warnbg)}
.empty{color:var(--ink4);font-size:13.5px;padding:16px 2px;text-align:center;border:1px dashed var(--line);border-radius:var(--r2)}
/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);font-size:14px;white-space:nowrap;
  transition:border-color .15s,background .15s,color .15s;
}
.btn:hover{border-color:var(--line);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn.primary:hover{background:var(--inkhover)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:var(--acchover)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--redline)}
.btn.danger:hover{background:var(--warnbg)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.xs{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{min-height:40px;padding:0 14px;font-size:13.5px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--onink)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--ink3);border:1px solid transparent}
.iconbtn:hover{background:##f2eee6;color:var(--ink)}
.iconbtn.del:hover{color:var(--red)}
/* ---------- 表单 ---------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:11.5px;letter-spacing:.08em;color:var(--ink3)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r2);
  background:#fff;font-size:16px;line-height:1.4;outline:none;transition:border-color .15s,box-shadow .15s;
}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(192,122,94,.12)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--ink3) 50%),linear-gradient(-45deg,transparent 49%,var(--ink3) 50%);background-size:6px 6px;background-position:calc(100% - 15px) 19px,calc(100% - 9px) 19px;background-repeat:no-repeat;padding-right:30px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:44px;cursor:pointer}
.chk input{width:19px;height:19px;min-height:0;accent-color:var(--accent)}
.tickbox{flex:0 0 auto;width:24px;height:24px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;color:transparent;background:#fff}
.tickbox.on{background:var(--sage);border-color:var(--sage);color:#fff}
/* ---------- 标签 ---------- */
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.tag.line{background:transparent;border-color:var(--line)}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.green{background:var(--greenbg);color:var(--green)}
.tag.blue{background:var(--bluebg);color:var(--blue)}
.tag.gold{background:var(--goldbg);color:var(--gold)}
.tag.plum{background:var(--plumbg);color:var(--plum)}
.tag.sage{background:var(--sagebg);color:var(--sage)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3)}
.pri i{width:6px;height:6px;border-radius:50%;background:var(--ink4);display:inline-block}
.pri.p1 i{background:var(--red)} .pri.p2 i{background:var(--gold)} .pri.p3 i{background:var(--ink4)}
/* ---------- 进度 ---------- */
.bar{height:7px;border-radius:20px;background:var(--line2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .4s}
.bar.thin{height:5px}
.mini{display:flex;align-items:center;gap:9px}
.mini .bar{flex:1}
.mini .pc{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
/* ---------- 今日 ---------- */
.today{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);background:linear-gradient(180deg,var(--surface2),var(--surface2));padding:16px 18px}
.todo{border-top:1px solid var(--line2)}
.todo .rw:last-child{border-bottom:0}
.idx{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.idxring{flex:0 0 auto;width:132px;position:relative}
.idxring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.idxring .mid b{font-size:31px;font-weight:600;line-height:1}
.idxring .mid span{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.idxlist{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
.idxlist .r{display:flex;align-items:center;gap:10px;font-size:13px}
.idxlist .r .nm{flex:0 0 62px;color:var(--ink2)}
.idxlist .r .bar{flex:1}
.idxlist .r .vv{flex:0 0 58px;text-align:right;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
/* ---------- 图表 ---------- */
.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutwrap .chart{max-width:186px}
/* ---------- 热力图 ---------- */
.heatrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.heatrow .hn{flex:0 0 118px;font-size:13.5px;min-width:0}
.heatrow .hn small{display:block;color:var(--ink3);font-size:11.5px}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;flex:1;min-width:190px}
.heat i{display:block;padding-top:100%;border-radius:2.5px;background:var(--h0)}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)} .heat i.l4{background:var(--h4)}
.heat i.tdy{outline:1.5px solid var(--accent);outline-offset:1px}
.streak{flex:0 0 auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* ---------- 时间轴 ---------- */
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:0}
.tl li{position:relative;padding:9px 0 9px 20px}
.tl li::before{content:"";position:absolute;left:-4.5px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--line);border:1.5px solid var(--surface)}
.tl li.now::before{background:var(--accent)}
.tl li.done::before{background:var(--sage)}
.tl .tm{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl .tt{font-size:14px}
/* ---------- 封面墙 ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px}
.cov{cursor:pointer}
.cov .im{position:relative;aspect-ratio:2/3;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;text-align:center}
.cov .im img{width:100%;height:100%;object-fit:cover;display:block}
.cov .im .ph{padding:10px;font-size:14px;line-height:1.35;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.cov .im .st{position:absolute;left:6px;top:6px;font-size:10.5px;padding:1px 6px;border-radius:20px;background:rgba(255,253,248,.92);color:var(--ink2)}
.cov .nm{font-size:13px;margin-top:7px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cov .rt{font-size:11.5px;color:var(--gold);letter-spacing:.06em}
.stars{letter-spacing:.08em;color:var(--gold);font-size:13px}
.stars .off{color:var(--line)}
.starpick{display:inline-flex;gap:2px}
.starpick button{font-size:20px;color:var(--line);line-height:1;padding:6px 2px;min-height:40px}
.starpick button.on{color:var(--gold)}
/* ---------- 提示条 / 弹层 ---------- */
.bn{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);margin-bottom:14px;font-size:13.5px;border:1px solid}
.bn.warn{background:var(--warnbg);border-color:var(--warnbd);color:var(--warnink)}
.bn.bad{background:var(--badbg);border-color:var(--badbd);color:var(--badink)}
.bn.info{background:var(--infobg);border-color:var(--infobd);color:var(--infoink)}
.bn .gr{flex:1;min-width:0}
.bn b{display:block;margin-bottom:2px}
.bn .btn{min-height:34px;padding:0 11px;font-size:13px;background:rgba(255,255,255,.7)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--onink);padding:11px 18px;border-radius:22px;font-size:14px;z-index:200;transition:.22s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--badink)}
.ovl{position:fixed;inset:0;background:var(--ovl);display:none;align-items:center;justify-content:center;padding:18px;z-index:150;overflow:auto}
.ovl.on{display:flex}
.mbox{background:var(--surface);border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(31,33,30,.2)}
.mbox h4{font-size:19px;font-weight:600;margin-bottom:8px}
.mbox p{font-size:14px;color:var(--ink2);line-height:1.6}
.mact{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:10px}
.kv dt{color:var(--ink3)}
.kv dd{font-variant-numeric:tabular-nums}
/* ---------- 表格式分布 ---------- */
.dist{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.subj .c{border:1px solid var(--line);border-radius:var(--r2);padding:10px 11px;background:var(--surface2)}
.subj .c .s1{font-size:13px;color:var(--ink2)}
.subj .c .s2{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.week .d{border:1px solid var(--line);border-radius:var(--r2);padding:9px;background:var(--surface2);min-height:96px}
.week .d.tdy{border-color:var(--accent);background:var(--accentbg)}
.week .d .dh{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.week .d .it{font-size:12px;line-height:1.4;padding:3px 0;border-top:1px solid var(--line2);word-break:break-word}
.week .d .it.dn{color:var(--ink4);text-decoration:line-through}
.slot{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.slot .tm{font-variant-numeric:tabular-nums;font-size:14px;flex:0 0 52px;color:var(--ink2)}
.slot .nm{flex:1;min-width:110px;font-size:14px}
.slot.ovd{background:var(--warnbg);border-radius:6px;padding-left:6px;padding-right:6px}
.slot .t2{font-size:12px;color:var(--ink3)}
/* ---------- 移动端 ---------- */
@media (max-width:980px){
  .gsplit,.gsplit2,.g3,.g2{grid-template-columns:1fr}
  .main{padding:26px 22px 80px}
}
@media (max-width:880px){
  .app{display:block}
  .rail{position:sticky;top:0;width:auto;height:auto;flex:none;display:block;
    padding:9px 12px;border-right:0;border-bottom:1px solid var(--line);
    background:rgba(255,253,249,.96);backdrop-filter:blur(8px) saturate(1.3);z-index:60}
  .brand{margin-bottom:8px}
  .nav{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;width:auto;min-height:44px;padding:0 13px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:14px}
  .nav button .badge{margin-left:2px}
  .rfoot{display:none}
  .main{padding:16px 14px calc(56px + env(safe-area-inset-bottom,0px));max-width:none}
  .stitle{font-size:23px}
  .g4{grid-template-columns:1fr 1fr}
  .statset{grid-template-columns:1fr 1fr;gap:12px}
  .statset > div{border-left:0;padding-left:0}
  .week{grid-template-columns:1fr 1fr}
  .heatrow .hn{flex:1 0 100%}
  .heat{min-width:0}
  .form .wide{grid-column:1/-1}
  .panel{padding:15px 14px 13px}
  .mbox{padding:18px}
  .wall{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
}
@media print{.rail,.hact,.btn{display:none}}
/* ---------- 配色切换 ---------- */
.themerow{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.themerow .tlbl{font-size:11px;letter-spacing:.06em;color:var(--ink3);margin-right:1px}
.td{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;background-clip:padding-box;transition:transform .15s,border-color .15s;box-shadow:var(--sh)}
.td:hover{transform:scale(1.14)}

.topt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.topt:hover{border-color:var(--accent2)}
.topt.on{border-color:var(--accent);background:var(--accentsoft)}
.topt .sw{width:26px;height:26px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.topt .nm{font-size:14px;font-weight:500;line-height:1.2}
.topt .ck{margin-left:auto;color:var(--accent);font-size:15px;opacity:0;transition:opacity .15s}

.ubanner .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.ubanner h3{font-size:19px;margin:2px 0 0}
.ubanner h3 .n{font-size:12px;font-weight:400;color:var(--sub);margin-left:6px}
.uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.utg{display:flex;gap:4px;background:var(--line);border-radius:9px;padding:3px}
.tg{border:0;background:none;color:var(--sub);font-size:13px;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:inherit}
.tg.on{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.ulist{display:flex;flex-direction:column;gap:6px;margin-top:12px}

.uli:hover{border-color:var(--accent)}

.uli .unm{display:flex;align-items:center;gap:5px}

.ubar{display:block;height:5px;width:100%;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}

/* ============ 合同视图 ============ */
.contract-view{padding:20px 24px 60px;max-width:1100px;margin:0 auto}
.contract-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.contract-toolbar input[type=search]{flex:1;min-width:200px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px}
.contract-toolbar input[type=search]:focus{outline:none;border-color:var(--accent)}
.contract-list{display:grid;gap:10px}
.contract-list .empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px}
.contract-item{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s}
.contract-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.contract-item h4{margin:0 0 6px;font-size:15px;color:var(--ink)}
.contract-item .meta{font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
.contract-item .meta b{color:var(--ink);font-weight:600}
.contract-item .actions{display:flex;gap:6px;margin-top:10px}
.contract-item .actions .btn{padding:5px 10px;font-size:12px}

/* ============ 合同 A4 页面（精确几何 190.5×290mm = PPT 原始尺寸） ============ */
.sheet-wrap{padding:8px 0;overflow:auto}
.contract-sheet{
  position:relative;
  width:190.5mm; min-height:290mm;
  background:#fff; color:#000;
  margin:0 auto;
  padding:0;
  box-shadow:0 4px 24px rgba(0,0,0,.12);
  font-family:"Microsoft YaHei","微软雅黑","PingFang SC",Arial,sans-serif;
  font-size:8pt; line-height:1.45;
  overflow:hidden;
}
.contract-sheet *{box-sizing:border-box;color:#000}
.contract-sheet input[type=text],.contract-sheet textarea{
  background:transparent;border:none;border-bottom:1px solid #888;
  font-family:inherit;color:#000;padding:0 2px;margin:0;outline:none;
  font-size:8pt;line-height:1.3;min-height:12px;
}
/* 可勾选 □ */
.contract-sheet .chk{
  display:inline-block;width:11px;height:11px;border:1px solid #333;
  vertical-align:-1px;margin:0 2px;cursor:pointer;border-radius:1px;
  font-size:0;line-height:11px;text-align:center;user-select:none;
}
.contract-sheet .chk.on{background:#000}
.contract-sheet .chk.on::before{content:"✓";color:#fff;font-size:9px;line-height:11px;font-weight:700}
/* 填空位 */
.contract-sheet .fi{display:inline-block;border-bottom:1px solid #000;text-align:center;vertical-align:bottom;padding:0 1px;min-height:13px}
.contract-sheet .fi input{border:none;width:100%;text-align:center;font-size:8pt;min-height:12px}

/* 标题 */
.ctitle{position:absolute;text-align:center;font-size:16pt;font-weight:700;color:#c00;white-space:nowrap}
.cno{position:absolute;font-size:10pt;font-weight:700;text-align:right;white-space:nowrap}
.clogo,.cstk{position:absolute;object-fit:contain}
.cfoot{position:absolute;font-size:8pt;color:#333;display:flex;gap:22px;align-items:center}
.cfoot b{font-weight:700}

/* 表格 */
.contract-sheet table.ct{position:absolute;border-collapse:collapse;font-size:8pt}
.contract-sheet table.ct td{border:1px solid #000;padding:2px 5px;vertical-align:middle;text-align:center}
.contract-sheet table.ct td.lbl{font-weight:700;background:#f7f7f7;white-space:nowrap}
.contract-sheet table.ct td input[type=text]{width:100%}

/* 主条款 */
.cbody{position:absolute;font-size:8pt;line-height:1.5;color:#000;white-space:pre-wrap;overflow:hidden}
.cbody p{margin:0 0 1px}
.cbody b{font-weight:700}
.cbody .red{color:#c00}

/* ============ PDF 合同模板覆盖层 ============ */
.csheet-img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:fill}
.c-top,.c-body,.c-bot{position:absolute;inset:0;pointer-events:none}
.c-top .fi,.c-body .fi,.c-bot .fi{position:absolute;display:block;border-bottom:1px solid #000;text-align:center;vertical-align:bottom;padding:0 1px;min-height:3.6mm;pointer-events:auto;background:transparent}
.c-top .fi input,.c-body .fi input{width:100%;text-align:center;background:transparent;border:none;padding:0;font:inherit;line-height:1.2;min-height:0;color:inherit}
.c-top .chk-ov,.c-body .chk-ov,.c-bot .chk-ov{position:absolute;display:block;width:3mm;height:3mm;border:0;background:transparent;cursor:pointer;font-size:0;line-height:3mm;text-align:center;pointer-events:auto}
.c-top .chk-ov.on,.c-body .chk-ov.on,.c-bot .chk-ov.on{background:transparent}
.c-top .chk-ov.on::before,.c-body .chk-ov.on::before,.c-bot .chk-ov.on::before{content:"\2713";color:#c00;font-size:2.6mm;line-height:3mm;font-weight:700;display:block}
.c-bot textarea{position:absolute;pointer-events:auto;background:rgba(255,255,255,.6);border:1px dashed #888;padding:1px 2px;font:8pt "Microsoft YaHei","微软雅黑",sans-serif;line-height:1.4;resize:none;color:#000}

/* 打印：与 PPT 打印一致（A4 缩放） */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff !important}
  .rail,.contract-toolbar,.contract-list-view,.hact,#usage,.toast,#modal,.banner{display:none !important}
  .contract-view{padding:0;max-width:none}
  .sheet-wrap{padding:0;overflow:visible}
  .contract-sheet{box-shadow:none;margin:0 auto;page-break-after:always}
}
@media (max-width:900px){
  .contract-sheet{zoom:.72}
}
/* ============ 合同 V2：模板编辑器（源码/预览）+ 模板填写 ============ */
.cview{display:none}
.cview.on{display:block}
.ctbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px;padding:12px 15px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ctbar input[type=search]{flex:1;min-width:160px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px}
.ctbar input[type=search]:focus{outline:none;border-color:var(--accent)}
.ctbar .sp{margin-left:auto}
.ctbar .tname{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.ctbar .tname b{color:var(--ink);font-weight:600}
.ctbar .zgrp{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px}
.ctbar .zgrp button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;width:30px;height:30px;border-radius:6px;cursor:pointer;line-height:1}
.ctbar .zgrp button:hover{background:var(--hover);color:var(--ink)}
.ctbar .zgrp .zl{font-size:12px;color:var(--ink3);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}

/* ---- 模板编辑器 ---- */
.tpl-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.tpl-side{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tpl-side .sh{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.tpl-side .sh b{font-size:13.5px}
.tpl-items{max-height:54vh;overflow:auto}
.tpl-item{padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.14s}
.tpl-item:hover{background:var(--hover)}
.tpl-item.on{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
.tpl-item .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-item .m{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.tpl-item .bd{display:inline-block;font-size:10px;padding:0 6px;border-radius:20px;background:var(--accentbg);color:var(--accent);border:1px solid var(--accentsoft)}
.tpl-sfoot{padding:10px 11px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line)}
.tpl-main{min-width:0}
.tpl-edbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 0 0;border-bottom:0}
.tpl-edbar .tpl-name{flex:1;min-width:150px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600}
.tpl-edbar .tpl-name:focus{outline:none;border-color:var(--accent)}
.tpl-sel{min-height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:12.5px;max-width:190px}
.tpl-edtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 13px;background:var(--surface2);border:1px solid var(--line);border-bottom:0}
.tpl-edtools .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tpl-edbody{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:0 0 10px 10px;overflow:hidden;background:var(--surface)}
.tpl-edbody.m-src .tpl-prevbox{display:none}
.tpl-edbody.m-prev .tpl-srcbox{display:none}
.tpl-edbody.m-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tpl-edbody.m-split .tpl-prevbox{border-left:1px solid var(--line)}
.tpl-srcbox{display:flex;min-height:540px;overflow:hidden;background:var(--surface)}
.tpl-gutter{flex:0 0 auto;padding:12px 8px 12px 12px;font:12px/1.7 Consolas,"Courier New",monospace;color:var(--ink4);text-align:right;user-select:none;background:var(--bg2);border-right:1px solid var(--line);overflow:hidden;white-space:pre;min-width:44px}
.tpl-src{flex:1;min-width:0;border:0;outline:none;resize:none;padding:12px;font:12px/1.7 Consolas,"Courier New",monospace;background:var(--surface);color:var(--ink);tab-size:2;white-space:pre;overflow:auto}
.tpl-prevbox{min-height:540px;background:var(--bg2);overflow:auto;padding:14px;display:block}
.tpl-fields{margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tpl-fields .fh{font-size:12px;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);cursor:pointer;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.fchip:hover{border-color:var(--accent);color:var(--ink)}
.fchip b{font-weight:600}
.fchip i{font-style:normal;color:var(--ink4);font-size:11px}
.fchip.t-chk b::before{content:"☑ "}
.fchip.t-area b::before{content:"▤ "}

/* ---- 纸张容器（缩放适配） ---- */
.sheet-scroll{overflow:auto;max-height:74vh;padding:12px;background:var(--bg2);border-radius:9px}
.sheet-fit{position:relative;margin:0 auto}
.contract-sheet{width:var(--pw,190.5mm);min-height:var(--ph,290mm);transform-origin:0 0}

/* ---- 预览态：字段高亮 ---- */
.pvwrap{position:relative;display:inline-block;outline:1px dashed var(--blue);outline-offset:1px;border-radius:2px;background:rgba(74,103,133,.07)}
.pvwrap::before{content:attr(data-lb);position:absolute;left:0;top:-11px;font:9px/1.5 sans-serif;color:#fff;background:var(--blue);padding:0 4px;border-radius:3px;white-space:nowrap;z-index:6;pointer-events:none;letter-spacing:.02em}
.contract-sheet [data-pv]{outline:1px dashed var(--blue);outline-offset:1px;background:rgba(74,103,133,.06)}

/* ---- 模板生成的填写控件 ---- */
.contract-sheet .tfi{border:0;border-bottom:1px solid #333;background:transparent;font:inherit;font-size:inherit;color:#000;padding:0 2px;min-height:1.15em;outline:none;text-align:center;min-width:36px}
.contract-sheet .tarea{border:1px dashed #999;background:rgba(255,255,255,.5);font:inherit;font-size:inherit;color:#000;padding:1px 3px;width:100%;line-height:1.5;resize:none;outline:none;display:block}
.contract-sheet .tfi:focus,.contract-sheet .tarea:focus{outline:1px solid rgba(0,0,0,.2);background:rgba(255,251,232,.5)}
.contract-sheet .tchk{display:inline-block;width:10px;height:10px;border:1px solid #333;vertical-align:-1px;margin:0 3px;cursor:pointer;font-size:0;line-height:10px;text-align:center;user-select:none}
.contract-sheet .tchk.on{background:#000}
.contract-sheet .tchk.on::before{content:"✓";color:#fff;font-size:8px;line-height:10px;font-weight:700}

/* ---- 填写页 ---- */
.fill-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.fill-side{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;position:sticky;top:10px}
.fill-side .sh{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.fill-side .sh b{font-size:13.5px}
.fill-fields{max-height:50vh;overflow:auto;padding:6px 13px}
.ff{padding:8px 0;border-bottom:1px solid var(--line2)}
.ff:last-child{border-bottom:0}
.ff > label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:4px}
.ff > label b{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff > label s{text-decoration:none;font-size:10.5px;color:var(--ink4);border:1px solid var(--line);border-radius:10px;padding:0 5px;flex:0 0 auto}
.ff input[type=text],.ff textarea{width:100%;min-height:34px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px}
.ff textarea{min-height:62px;resize:vertical;line-height:1.6}
.ff input:focus,.ff textarea:focus{outline:none;border-color:var(--accent)}
.ff.act{background:var(--accentbg);box-shadow:0 0 0 6px var(--accentbg)}
.ffck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;min-height:32px;user-select:none}
.ffck i{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;flex:0 0 auto}
.ffck.on i{background:var(--accent);border-color:var(--accent)}
.ffck.on i::before{content:"✓"}
.ffck.on{color:var(--ink)}
.fill-meta{padding:11px 13px;border-top:1px solid var(--line);background:var(--surface2)}
.fill-meta .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.fill-meta .row:last-child{margin-bottom:0}
.fill-meta .row span{flex:0 0 54px;font-size:12px;color:var(--ink3)}
.fill-meta .row input{flex:1;min-width:0;min-height:32px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:12.5px}
.fill-meta .row input:focus{outline:none;border-color:var(--accent)}

/* ---- 模板选择弹层 ---- */
.tplpick{display:grid;gap:9px;margin:14px 0 4px}
.tplpick-i{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer;font:inherit;transition:.15s}
.tplpick-i:hover{border-color:var(--accent);background:var(--accentbg);transform:translateY(-1px)}
.tplpick-i b{display:block;font-size:14px;color:var(--ink)}
.tplpick-i span{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.tplpick-i i{display:block;font-style:normal;font-size:11px;color:var(--ink4);margin-top:2px}
.mbox-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

@media(max-width:1080px){
  .tpl-wrap{grid-template-columns:1fr}
  .tpl-items{max-height:260px}
  .fill-wrap{grid-template-columns:1fr}
  .fill-side{position:static}
  .tpl-edbody.m-split{grid-template-columns:1fr}
  .tpl-edbody.m-split .tpl-prevbox{border-left:0;border-top:1px solid var(--line)}
  .contract-view{max-width:none}
}
@media(max-width:900px){ .contract-sheet{zoom:1} }

/* ---- 打印：只输出合同纸 ---- */
@media print{
  html,body{background:#fff !important}
  .rail,.ctbar,.contract-toolbar,.subtabs,.hact,#usage,.toast,#modal,#recover,.banner,
  .fill-side,.tpl-wrap,.contract-list,.tpl-side,.tpl-main{display:none !important}
  .cview{display:block !important}
  .contract-view{padding:0;max-width:none}
  .fill-wrap{display:block}
  .sheet-scroll{padding:0;overflow:visible;max-height:none;background:#fff}
  .sheet-fit{width:auto !important;height:auto !important}
  .contract-sheet{transform:none !important;box-shadow:none;margin:0 auto;page-break-after:always;width:var(--pw,190.5mm) !important;min-height:var(--ph,290mm) !important}
  .contract-sheet .tfi,.contract-sheet .tarea{border-color:transparent !important;background:transparent !important}
  .pvwrap{outline:0 !important;background:transparent !important}
  .pvwrap::before{display:none !important}
  .contract-sheet [data-pv]{outline:0 !important;background:transparent !important}
}
/* ============ 子标签切换 ============ */
.subtabs{display:inline-flex;gap:3px;padding:4px;background:var(--bg2);border-radius:10px}
.subtab{border:0;background:transparent;color:var(--ink3);font:inherit;font-size:13.5px;padding:7px 15px;border-radius:7px;cursor:pointer;min-height:36px;transition:.16s}
.subtab:hover{color:var(--ink)}
.subtab.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
/* ============ 体检数据 ============ */
.ckdrop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px 18px;text-align:center;background:var(--surface2);cursor:pointer;transition:.18s}
.ckdrop:hover{border-color:var(--accent);background:var(--accentbg)}
.ckdrop b{display:block;font-size:14.5px;margin-bottom:4px}
.ckdrop span{display:block;font-size:12px;color:var(--ink3);line-height:1.6}
.ckdrop svg{vertical-align:-3px;margin-right:5px}
.ckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ckbar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.ckseg{display:inline-flex;gap:2px;padding:3px;background:var(--bg2);border-radius:9px}
.ckseg button{border:0;background:transparent;color:var(--ink3);font:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer;min-height:34px}
.ckseg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.ckkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.ckkpi{border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;background:var(--surface2)}
.ckkpi i{display:block;font-size:11px;letter-spacing:.07em;color:var(--ink3);font-style:normal}
.ckkpi b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.2}
.ckkpi s{display:block;font-size:11.5px;color:var(--ink3);text-decoration:none;margin-top:2px}
.ckkpi.bad b{color:var(--red)}
.ckkpi.warn b{color:var(--gold)}
.ckscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cktb{width:100%;border-collapse:collapse;font-size:13px}
.cktb th{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.05em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.cktb td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.cktb tr:last-child td{border-bottom:0}
.cktb tbody tr:hover{background:var(--hover)}
.cktb .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cktb .nm{font-weight:500}
.cktb .u{color:var(--ink3);font-size:11.5px}
.cktb .rng{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.cktb .hi{color:var(--red);font-weight:600}
.cktb .lo{color:var(--blue);font-weight:600}
.cktb .ok{color:var(--ink2)}
.cktb .dl{color:var(--ink2)}
.cktb .up{color:var(--red)}
.cktb .dn{color:var(--green)}
.cktb td.act,.cktb th.act{text-align:right;width:1%}
.ckgrp{font-size:12px;color:var(--ink3);letter-spacing:.08em;margin:16px 0 6px}
.ckgrp:first-child{margin-top:6px}
.ckrd{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface);display:flex;gap:14px;align-items:flex-start}
.ckrd + .ckrd{margin-top:9px}
.ckrd .gr{flex:1;min-width:0}
.ckrd .t1{font-size:14.5px;font-weight:600}
.ckrd .t2{font-size:12px;color:var(--ink3);margin-top:3px}
.ckrd.open{background:var(--surface2)}
.ckchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;min-height:30px}
.ckchip.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.ckchips{display:flex;flex-wrap:wrap;gap:7px;max-height:132px;overflow-y:auto;padding:2px}
.ckpos{width:60px;height:7px;border-radius:20px;background:var(--line2);position:relative;overflow:hidden}
.ckpos > i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:20px}
.ckpos > u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);border-radius:2px}
.cknote{font-size:12px;color:var(--ink3);line-height:1.7;margin-top:10px}
.cknote b{color:var(--ink2)}
@media(max-width:680px){
  .subtabs{width:100%}
  .subtab{flex:1;padding:8px 6px;font-size:13px;min-height:42px}
  .cktb{font-size:12.5px}
  .cktb th,.cktb td{padding:7px 7px}
  .ckrd{flex-wrap:wrap}
}

/* ---------- 天气预报模块 ---------- */
img{max-width:100%;height:auto}
.wx-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.wx-bar .fld{flex:1 1 220px;min-width:0}
.wx-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.wx-chip{font:inherit;font-size:12.5px;line-height:1.4;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;min-height:32px}
.wx-chip:hover{border-color:var(--ink3);color:var(--ink)}
.wx-res{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.wx-res:empty{display:none}
.wx-res button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-size:13.5px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;color:var(--ink);cursor:pointer}
.wx-res button:hover{border-color:var(--ink3);background:var(--hover)}
.wx-res .ad{font-size:12px;color:var(--ink3);text-align:right}
.wx-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:center}
.wx-cur{display:flex;align-items:center;gap:14px;color:var(--accent2)}
.wx-big{font-size:42px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.wx-cond{font-size:13.5px;color:var(--ink2);margin-top:6px}
.wx-kv{display:flex;flex-direction:column;gap:3px}
.wx-kv .lb{font-size:11.5px;letter-spacing:.08em;color:var(--ink3)}
.wx-kv .vl{font-size:19px;font-weight:600;color:var(--ink)}
.wx-kv .vl small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:3px}
.wx-days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wx-day{border:1px solid var(--line);border-radius:var(--r2);padding:11px 8px;text-align:center;background:var(--surface2);min-width:0;color:var(--ink2)}
.wx-day .d1{font-size:12px;color:var(--ink3)}
.wx-day .d2{font-size:12.5px;font-weight:600;color:var(--ink);margin:3px 0 7px}
.wx-day .t{font-size:13px;margin-top:7px;font-variant-numeric:tabular-nums}
.wx-day .t b{font-weight:600;color:var(--ink)}
.wx-day .t span{color:var(--ink3);margin-left:4px}
.wx-day .pc{font-size:11.5px;color:var(--blue);margin-top:4px}
.wx-msg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r2);background:var(--surface2);border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.wx-msg.bad{background:var(--badbg);border-color:var(--badbd);color:var(--badink)}
@media(max-width:820px){
  .wx-days{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:520px){
  .wx-days{grid-template-columns:repeat(2,1fr)}
  .wx-big{font-size:36px}
}
/* ---------- 班级查询模块 ---------- */
.tag.gold{background:var(--goldbg);color:var(--gold)}
.cls-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 18px;margin:2px 0 16px}
.cls-stats > div{border-left:1px solid var(--line);padding-left:14px}
.cls-stats > div:first-child{border-left:0;padding-left:0}
.cls-stats .lb{font-size:11.5px;letter-spacing:.08em;color:var(--ink3)}
.cls-stats .vl{font-size:20px;font-weight:600;margin-top:2px}
.cls-stats .vl small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:3px}
.cls-tblwrap{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
.cls-tblwrap table{width:100%}
.cls-tblwrap thead th{position:sticky;top:0;z-index:2}
/* 姓名列收窄：按 5 个汉字宽度（约 85px）固定，避免列被拉伸 */
.cls-tblwrap .cktb th:nth-child(2),.cls-tblwrap .cktb td:nth-child(2){width:85px}
.cls-tblwrap .cktb td.nm{padding-left:7px;padding-right:5px;min-width:85px}
.cls-tblwrap .cktb td.nm .tag{font-size:9.5px;padding:0 3px;margin-left:2px;border-radius:9px}
@media(max-width:520px){
  /* 窄屏空间有限，姓名列恢复自适应，避免表格额外横向滚动 */
  .cls-tblwrap .cktb th:nth-child(2),.cls-tblwrap .cktb td:nth-child(2){width:auto}
  .cls-tblwrap .cktb td.nm{min-width:0}
}
.cls-tr{cursor:pointer}
.cls-tr.flag td{background:var(--warnbg)}
.cls-tr.flag:hover td{background:var(--warnbg);box-shadow:inset 0 0 0 9999px rgba(0,0,0,.012)}
.cls-tr.sel td{background:var(--accentsoft)}
.cls-tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.cls-det{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);padding:14px 16px;margin-bottom:14px}
.cls-det .t1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cls-det .t2{font-size:12px;color:var(--ink3);margin-top:3px}
.cls-seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.cls-seat{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:9px 11px}
.cls-seat .lb{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.08em}
.cls-seat .vl{display:block;font-size:14px;font-weight:600;margin-top:3px}
.cls-seat .u{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.cls-note{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.7}
.cls-note.warn{color:var(--warnink);background:var(--warnbg);border:1px solid var(--warnbd);border-radius:var(--r2);padding:8px 10px}
.cls-empty{color:var(--ink4);font-size:13.5px;padding:26px 2px;text-align:center;border:1px dashed var(--line);border-radius:var(--r2)}
.cls-more{display:flex;justify-content:center;margin-top:12px}
@media(max-width:760px){
  .cls-tblwrap{max-height:440px}
  .cls-stats{grid-template-columns:repeat(2,1fr)}
  .cls-stats > div:nth-child(2n){border-left:0;padding-left:0}
}

/* ============================================================
   内联 SVG 图表（全部手写，无任何图表库）
   ============================================================ */
function noData(t) { return '<p class="empty">' + (t || '暂无数据') + '</p>'; }

function svgLine(pts, o) {
  o = o || {};
  if (!pts.length) return noData();
  var w = o.w || 640, h = o.h || 196, cl = o.color || '#9c5540', inv = !!o.invert,
    fmt = o.fmt || function (v) { return v; }, L = 42, R = 14, T = 16, B = 28;
  var iw = w - L - R, ih = h - T - B;
  var vs = pts.map(function (p) { return p.value; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  if (o.min !== undefined) mn = Math.min(mn, o.min);
  if (o.max !== undefined) mx = Math.max(mx, o.max);
  if (mn === mx) { mn = mn - 1; mx = mx + 1; }
  var sp = mx - mn;
  var X = function (i) { return L + (pts.length === 1 ? iw / 2 : iw * i / (pts.length - 1)); };
  var Y = function (v) { var r = (v - mn) / sp; return T + ih * (inv ? r : 1 - r); };
  var g = '';
  for (var i = 0; i <= 3; i++) {
    var y = T + ih * i / 3, val = inv ? mn + sp * i / 3 : mx - sp * i / 3;
    g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (w - R) + '" y2="' + y.toFixed(1) + '" stroke="#ece8df" stroke-width="1"/>' +
      '<text x="' + (L - 7) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10.5" fill="#a9aaa1" text-anchor="end">' + fmt(Math.round(val * 10) / 10) + '</text>';
  }
  var pl = pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.value).toFixed(1); }).join(' ');
  var area = '';
  if (o.area !== false) {
    area = '<polygon points="' + L + ',' + (T + ih) + ' ' + pl + ' ' + (X(pts.length - 1)).toFixed(1) + ',' + (T + ih) + '" fill="' + cl + '" opacity=".07"/>';
  }
  var dots = pts.map(function (p, i) {
    return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="3.4" fill="#fffdfa" stroke="' + cl + '" stroke-width="1.8"><title>' + esc(p.label) + '：' + fmt(p.value) + '</title></circle>';
  }).join('');
  var step = Math.ceil(pts.length / 6);
  var lb = pts.map(function (p, i) {
    if (i % step !== 0 && i !== pts.length - 1) return '';
    return '<text x="' + X(i).toFixed(1) + '" y="' + (h - 8) + '" font-size="10.5" fill="#a9aaa1" text-anchor="middle">' + esc(p.label) + '</text>';
  }).join('');
  var last = '<text x="' + X(pts.length - 1).toFixed(1) + '" y="' + (Y(pts[pts.length - 1].value) - 10).toFixed(1) + '" font-size="11.5" font-weight="600" fill="' + cl + '" text-anchor="end">' + fmt(pts[pts.length - 1].value) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + g + area +
    '<polyline points="' + pl + '" fill="none" stroke="' + cl + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + lb + last + '</svg>';
}

function svgBars(data, o) {
  o = o || {};
  if (!data.length) return noData();
  var w = o.w || 640, h = o.h || 196, L = 42, R = 12, T = 18, B = 30;
  var iw = w - L - R, ih = h - T - B;
  var fmt = o.fmt || function (v) { return v; };
  var mx = Math.max.apply(null, data.map(function (d) { return Math.abs(d.value); }));
  if (o.max !== undefined) mx = Math.max(mx, o.max);
  if (mx <= 0) mx = 1;

  var g = '';
  for (var i = 0; i <= 2; i++) {
    var y = T + ih * i / 2;
    g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (w - R) + '" y2="' + y.toFixed(1) + '" stroke="#ece8df"/>' +
      '<text x="' + (L - 7) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10.5" fill="#a9aaa1" text-anchor="end">' + fmt(Math.round(mx - mx * i / 2)) + '</text>';
  }
  var bars = data.map(function (d, i) {
    var bh = Math.max(1.5, ih * Math.abs(d.value) / mx);

    return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + pw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + c + '" opacity="' + (d.dim ? .38 : .88) + '"><title>' + esc(d.label) + '：' + fmt(d.value) + '</title></rect>' +
      (o.valLabel === false ? '' : '<text x="' + (x + pw / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" font-size="10.5" fill="#7c7e75" text-anchor="middle">' + fmt(d.value) + '</text>') +
      '<text x="' + (x + pw / 2).toFixed(1) + '" y="' + (h - 9) + '" font-size="10.5" fill="#a9aaa1" text-anchor="middle">' + esc(d.label) + '</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' + g + bars + '</svg>';
}

function svgDonut(items, o) {
  o = o || {};
  var tot = sum(items.map(function (d) { return d.value; }));
  if (!items.length || tot <= 0) return noData('暂无分类数据');
  var sz = 186, cx = sz / 2, cy = sz / 2, r = 66, sw = 26, a = -Math.PI / 2, out = '';
  items.forEach(function (d) {
    var ang = d.value / tot * Math.PI * 2, a2 = a + ang;
    var x0 = cx + r * Math.cos(a), y0 = cy + r * Math.sin(a), x1 = cx + r * Math.cos(a2), y1 = cy + r * Math.sin(a2);
    var la = ang > Math.PI ? 1 : 0;
    if (ang > 6.2830) {

    } else {
      out += '<path d="M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + la + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
        '" fill="none" stroke="' + d.color + '" stroke-width="' + sw + '" stroke-linecap="butt"><title>' + esc(d.label) + '：' + (o.fmt ? o.fmt(d.value) : d.value) + '（' + Math.round(d.value / tot * 100) + '%）</title></path>';
    }
    a = a2;
  });
  out += '<text x="' + cx + '" y="' + (cy - 3) + '" font-size="10.5" fill="#a9aaa1" text-anchor="middle">' + esc(o.centerLabel || '合计') + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 16) + '" font-size="16" font-weight="600" fill="#1f211e" text-anchor="middle">' + esc(o.fmt ? o.fmt(tot) : tot) + '</text>';

}

function svgRing(p, o) {
  o = o || {};
  var sz = 132, c = sz / 2, r = 54, sw = 11, cir = 2 * Math.PI * r;
  var v = clamp(p, 0, 100), cl = o.color || (v >= 80 ? '#6c7d66' : v >= 55 ? '#b0863a' : '#c07a5e');

    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="#eae5da" stroke-width="' + sw + '"/>' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + cl + '" stroke-width="' + sw + '" stroke-linecap="round" ' +
    'stroke-dasharray="' + (cir * v / 100).toFixed(1) + ' ' + cir.toFixed(1) + '" transform="rotate(-90 ' + c + ' ' + c + ')"/></svg>';

function svgHist(bins, o) {
  o = o || {};
  if (!bins.length) return noData();
  var w = 640, h = 178, L = 34, R = 12, T = 14, B = 30;
  var iw = w - L - R, ih = h - T - B;

function hval(h, day) { var v = S.hlog[h.id + '|' + day]; return v === undefined ? null : v; }
function hdone(h, day) {
  var v = hval(h, day);
  if (v === null) return false;
  if (h.type === 'check') return !!v;
  if (h.type === 'count') return num(v) >= Math.max(1, num(h.target, 1));
  return true;
}
function hratio(h, day) {
  var v = hval(h, day);
  if (v === null) return 0;
  if (h.type === 'check') return v ? 1 : 0;
  if (h.type === 'count') return clamp(num(v) / Math.max(1, num(h.target, 1)), 0, 1);
  return 1;
}
function hstreak(h) {
  var n = 0;
  for (var i = 0; i < 400; i++) {
    if (hdone(h, shift(-i))) n++;
    else { if (i === 0) continue; break; }
  }
  return n;
}
function medSlots(day) {
  var out = [];
  S.meds.forEach(function (m) {
    if (!m.on) return;
    (m.times || []).forEach(function (t) {
      var k = m.id + '|' + day + '|' + t;
      out.push({ med: m, id: m.id, time: t, key: k, taken: !!S.mlog[k] });
    });
  });
  out.sort(function (a, b) { return t2m(a.time) - t2m(b.time); });
  return out;
}

function lifeIndex() {
  var T = today(), parts = [];
  var hs = S.habits.length, hd = S.habits.filter(function (h) { return hdone(h, T); }).length;
  parts.push({ nm: '习惯', w: 30, r: hs ? hd / hs : 1, txt: hs ? hd + '/' + hs : '未设置' });
  var ms = medSlots(T), mt = ms.filter(function (x) { return x.taken; }).length;
  parts.push({ nm: '用药', w: 15, r: ms.length ? mt / ms.length : 1, txt: ms.length ? mt + '/' + ms.length : '无计划' });
  var st = S.sch.filter(function (s) { return s.date === T; }), sd = st.filter(function (s) { return s.done; }).length;
  var ovd = S.sch.filter(function (s) { return !s.done && s.date < T; }).length;
  var sr = st.length ? sd / st.length : 1;
  sr = clamp(sr - ovd * 0.2, 0, 1);
  parts.push({ nm: '日程', w: 25, r: sr, txt: st.length ? sd + '/' + st.length + (ovd ? '（逾期 ' + ovd + '）' : '') : (ovd ? '逾期 ' + ovd : '无安排') });
  var mk = mkey(T), bg = num(S.settings.budget), exp = sum(S.tx.filter(function (t) { return t.type === 'expense' && mkey(t.date) === mk; }).map(function (t) { return num(t.amount); }));
  var br = bg > 0 ? clamp(1 - Math.max(0, exp / bg - 0.75) / 0.5, 0, 1) : 1;
  parts.push({ nm: '预算', w: 20, r: br, txt: bg > 0 ? pct(exp, bg) + '%' : '未设预算' });
  var rec = S.tx.some(function (t) { return t.date === T; }) || Object.keys(S.hlog).some(function (k) { return k.indexOf('|' + T) > 0; }) || S.sch.some(function (s) { return s.date === T && s.done; });
  parts.push({ nm: '记录', w: 10, r: rec ? 1 : 0, txt: rec ? '今日已记录' : '还没记录' });

  return { score: score, parts: parts };
}

function wxGeocode(q, cb) {

    fetch(u).then(function (r) {

}

    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +

/* ============================================================

      } else if (hb.type === 'count') {

          '<b style="min-width:56px;text-align:center;font-variant-numeric:tabular-nums">' + num(v) + ' / ' + Math.max(1, num(hb.target, 1)) + '</b>' +
          '<button class="btn xs" data-act="habTick" data-id="' + hb.id + '">＋</button></div>';
      } else {
        ctrl = '<div class="flex" style="gap:6px"><input type="number" step="0.1" inputmode="decimal" id="hn_' + hb.id + '" value="' + (v === null ? '' : v) + '" placeholder="' + esc(hb.unit || '数值') + '" style="width:96px;min-height:38px" data-enter="habNum" data-id="' + hb.id + '">' +
          '<button class="btn xs" data-act="habNum" data-id="' + hb.id + '">记录</button></div>';
      }
      return '<div class="rw"><div class="gr"><div class="t1">' + esc(hb.name) + (dn ? ' <span class="tag sage">已完成</span>' : '') + (hb.d ? ' <span class="tag line">演示</span>' : '') + '</div>' +
        '<div class="t2">' + (hb.type === 'check' ? '勾选打卡' : hb.type === 'count' ? '计数目标 ' + Math.max(1, num(hb.target, 1)) + ' ' + esc(hb.unit || '') : '数值记录 ' + esc(hb.unit || '')) +
        ' · 连续 ' + hstreak(hb) + ' 天</div></div>' + ctrl +
        '<button class="iconbtn del" data-act="habDel" data-id="' + hb.id + '" title="删除习惯"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/></svg></button></div>';
    }).join('') + '</div>';
  }
  h += '</div>';

  /* 30 天热力图 */
  var days = [];
  for (var i = 29; i >= 0; i--) days.push(shift(-i));
  h += '<div class="panel" style="margin-top:16px"><div class="phead"><h3 class="blk">30 天热力图</h3><span class="sub">' + mdOf(days[0]) + ' 至 ' + mdOf(days[29]) + ' · 颜色越深完成度越高</span></div>';
  if (!S.habits.length) h += noData();
  else {
    h += S.habits.map(function (hb) {
      var doneN = days.filter(function (d) { return hdone(hb, d); }).length;
      return '<div class="heatrow"><div class="hn">' + esc(hb.name) + '<small>' + doneN + '/30 天 · ' + pct(doneN, 30) + '%</small></div>' +
        '<div class="heat">' + days.map(function (d) {
          var r = hratio(hb, d), lv = r <= 0 ? 0 : r < .4 ? 1 : r < .7 ? 2 : r < 1 ? 3 : 4;
          var v = hval(hb, d);
          return '<i class="l' + lv + (d === T ? ' tdy' : '') + '" title="' + d + '：' + (v === null ? '未记录' : v + (hb.unit || '')) + '"></i>';
        }).join('') + '</div>' +
        '<div class="streak">连续 ' + hstreak(hb) + ' 天</div></div>';
    }).join('');
    var nums = S.habits.filter(function (x) { return x.type === 'number'; });
    if (nums.length) {
      var hb0 = nums[0];
      var pts = days.filter(function (d) { return hval(hb0, d) !== null; }).map(function (d) { return { label: mdOf(d).replace('月', '/').replace('日', ''), value: num(hval(hb0, d)) }; });
      if (pts.length > 1) {
        h += '<div class="hair"></div><h3 class="blk" style="margin-bottom:8px">' + esc(hb0.name) + ' 趋势 <span class="n">' + esc(hb0.unit || '') + '</span></h3>' + svgLine(pts, { color: '#4a6785' });
      }
    }
  }
  h += '<div class="hair"></div><div class="form">' +
    '<div class="fld"><span>习惯名称</span><input type="text" id="hName" placeholder="例如：晨跑 / 阅读 / 体重" data-enter="habAdd"></div>' +
    '<div class="fld"><span>打卡方式</span><select id="hType"><option value="check">勾选（做了就打勾）</option><option value="count">计数（累计次数）</option><option value="number">数值（记录读数）</option></select></div>' +
    '<div class="fld"><span>目标（计数用）</span><input type="number" id="hTarget" inputmode="numeric" placeholder="例如 8"></div>' +
    '<div class="fld"><span>单位</span><input type="text" id="hUnit" placeholder="杯 / 页 / kg"></div>' +
    '<div class="fld"><span>&nbsp;</span><button class="btn acc" data-act="habAdd">新增习惯</button></div></div></div>';

  if (!slots.length) h += noData('还没有用药计划');
  else {

        (sl.taken ? '<span class="tag sage">已服用</span>' : late ? '<span class="tag red">已过点</span>' : soon ? '<span class="tag gold">即将到点</span>' : '<span class="tag">待服用</span>') +
        '<button class="btn xs" data-act="medTake" data-id="' + sl.med.id + '" data-t="' + sl.time + '">' + (sl.taken ? '撤销' : '已服用') + '</button></div>';
    }).join('') + '</div>';
    var d7 = 0, t7 = 0;
    for (var j = 0; j < 7; j++) {
      var dd = shift(-j), ss = medSlots(dd);
      t7 += ss.length; d7 += ss.filter(function (x) { return x.taken; }).length;
    }
    h += '<div class="mini" style="margin-top:12px"><span class="sub" style="flex:0 0 auto">近 7 天服药率</span><span class="bar thin"><i style="width:' + pct(d7, t7) + '%;background:var(--sage)"></i></span><span class="pc">' + pct(d7, t7) + '%</span></div>';
  }
  h += '<div class="hair"></div><div class="form">' +
    '<div class="fld"><span>药品名称</span><input type="text" id="mName" placeholder="例如：维生素 D" data-enter="medAdd"></div>' +
    '<div class="fld"><span>剂量</span><input type="text" id="mDose" placeholder="1 粒"></div>' +
    '<div class="fld"><span>服用时间（可多个，逗号分隔）</span><input type="text" id="mTimes" placeholder="08:30,20:30" data-enter="medAdd"></div>' +
    '<div class="fld wide"><span>备注</span><input type="text" id="mNote" placeholder="饭后 / 忌与钙同服"></div>' +
    '<div class="fld"><span>&nbsp;</span><button class="btn acc" data-act="medAdd">添加用药</button></div></div>';
  if (S.meds.length) {
    h += '<div class="hair"></div>' + S.meds.map(function (m) {
      return '<div class="rw"><div class="gr"><div class="t1">' + esc(m.name) + (m.on ? '' : ' <span class="tag">已暂停</span>') + (m.d ? ' <span class="tag line">演示</span>' : '') + '</div>' +
        '<div class="t2">' + esc((m.times || []).join(' / ')) + (m.dose ? ' · ' + esc(m.dose) : '') + (m.note ? ' · ' + esc(m.note) : '') + '</div></div>' +
        '<button class="btn xs" data-act="medToggle" data-id="' + m.id + '">' + (m.on ? '暂停' : '启用') + '</button>' +
        '<button class="iconbtn del" data-act="medDel" data-id="' + m.id + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/></svg></button></div>';
    }).join('');
  }
  h += '</div>';

  /* 今日时间安排 */
  var tl = [];
  slots.forEach(function (sl) { tl.push({ t: sl.time, title: '服用 ' + sl.med.name, k: '用药', done: sl.taken }); });
  S.sch.filter(function (s) { return s.date === T; }).forEach(function (s) { tl.push({ t: s.time || '', title: s.title, k: s.cat, done: !!s.done }); });
  tl.sort(function (a, b) { return t2m(a.t || '23:59') - t2m(b.t || '23:59'); });
  h += '<div class="panel"><div class="phead"><h3 class="blk">今日时间安排</h3><span class="sub">当前 ' + pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()) + ' · 页面每 30 秒自动刷新提醒</span></div>';
  if (!tl.length) h += noData('今天没有定时安排');
  else {
    h += '<ul class="tl">' + tl.map(function (x) {
      var m = t2m(x.t || '23:59'), cur = !x.done && Math.abs(m - nm) <= 30;

  return h;
}

    h += rp.length ? svgLine(rp, { color: '#4a6785', invert: true, fmt: function (v) { return '第' + v; } }) : noData('还没有登记全班成绩');
    h += '</div></div>';

    /* 单科分析 */
    var subs = subjOf(last.grade);
    var hist = {};
    subs.forEach(function (s) {
      var vs = list.filter(function (ex) { return ex.grade === last.grade && num(ex.scores[s[0]]) > 0; }).map(function (ex) { return num(ex.scores[s[0]]) / s[1]; });
      hist[s[0]] = vs.length ? sum(vs) / vs.length : 0;
    });
    h += '<div class="panel" style="margin-top:16px"><div class="phead"><h3 class="blk">单科得分率分析 <span class="n">' + esc(last.name) + '</span></h3>' +
      '<span class="sub">柱高 = 本次得分率，浅色 = 同年级历史均值</span></div>';
    var bars = [];
    subs.forEach(function (s) {
      var r = num(last.scores[s[0]]) / s[1] * 100;
      bars.push({ label: s[0], value: Math.round(r * 10) / 10, color: r >= 85 ? '#6c7d66' : r >= 70 ? '#b0863a' : '#c0392b' });
      bars.push({ label: '', value: Math.round(hist[s[0]] * 1000) / 10, color: '#c8cdc0', dim: true, valLabel: false });
    });
    h += svgBars(bars, { fmt: function (v) { return v; }, bw: 16, valLabel: false });
    h += '<div class="subj" style="margin-top:14px">' + subs.map(function (s) {
      var sc = num(last.scores[s[0]]), r = sc / s[1] * 100, hv = hist[s[0]] * 100;
      var d = Math.round((r - hv) * 10) / 10;
      return '<div class="c"><div class="s1">' + s[0] + ' <span class="sub">/ ' + s[1] + '</span></div><div class="s2">' + sc + '</div>' +
        '<div class="mini"><span class="bar thin"><i style="width:' + clamp(r, 0, 100) + '%;background:' + (r >= 85 ? 'var(--sage)' : r >= 70 ? 'var(--gold)' : 'var(--red)') + '"></i></span><span class="pc">' + Math.round(r) + '%</span></div>' +
        '<div class="tiny" style="margin-top:4px">较历史 ' + (d >= 0 ? '<span class="red">+' + d + '</span>' : '<span class="green">' + d + '</span>') + ' 个点</div></div>';
    }).join('') + '</div>';
    var weak = subs.map(function (s) { return { n: s[0], r: num(last.scores[s[0]]) / s[1] }; }).sort(function (a, b) { return a.r - b.r; });
    h += '<p class="tiny" style="margin-top:12px">分析建议：<b>' + esc(weak[0].n) + '</b>（' + Math.round(weak[0].r * 100) + '%）与 <b>' + esc(weak[1].n) + '</b>（' + Math.round(weak[1].r * 100) + '%）得分率最低，是提分空间最大的两科；' +
      '<b>' + esc(weak[weak.length - 1].n) + '</b> 保持得最好。</p></div>';

    /* 班级分布 */
    h += '<div class="panel" style="margin-top:16px"><div class="phead"><h3 class="blk">全班分数分布 <span class="n">' + esc(last.name) + '</span></h3>' +
      '<button class="btn xs" data-act="clsEdit" data-id="' + last.id + '">登记 / 修改全班成绩</button></div>';
    if (!st.n) h += noData('还没有登记这次考试的全班成绩，点右上按钮录入');
    else {
      var mn = st.min, mx = st.max, step = Math.max(10, Math.ceil((mx - mn) / 8 / 10) * 10), bins = [];
      for (var b = Math.floor(mn / step) * step; b <= mx; b += step) {
        var lo = b, hi = b + step;
        bins.push({
          label: lo + '', n: st.arr.filter(function (v) { return v >= lo && v < hi; }).length,
          me: st.total >= lo && st.total < hi
        });
      }
      h += svgHist(bins) +
        '<div class="statset" style="margin-top:12px">' +
        '<div class="stat"><div class="lb">班级人数</div><div class="vl">' + st.n + '</div></div>' +
        '<div class="stat"><div class="lb">班级均分</div><div class="vl">' + st.avg + '</div></div>' +
        '<div class="stat"><div class="lb">最高 / 最低</div><div class="vl">' + st.max + '<small>/ ' + st.min + '</small></div></div>' +
        '<div class="stat"><div class="lb">中位数</div><div class="vl">' + st.med + '</div></div>' +
        '<div class="stat"><div class="lb">我的位置</div><div class="vl">第 ' + st.rank + '</div><div class="df">击败班上 ' + Math.max(0, st.n - st.rank) + ' 人</div></div>' +
        '</div><p class="tiny" style="margin-top:8px">深色柱子是我所在的分数段。</p>';
    }
    h += '</div>';

    /* 列表 */
    h += '<div class="panel" style="margin-top:16px"><div class="phead"><h3 class="blk">考试记录 <span class="n">' + list.length + ' 次</span></h3></div><div class="rows">' +
      list.slice().reverse().map(function (ex) {
        var s = examStat(ex);
        return '<div class="rw"><div class="gr"><div class="t1">' + esc(ex.name) + ' <span class="tag line">' + esc(ex.grade) + '</span>' + (ex.d ? ' <span class="tag line">演示</span>' : '') + '</div>' +
          '<div class="t2">' + esc(ex.date) + ' · 总分 ' + s.total + '/' + s.full + ' · 得分率 ' + s.rate + '%' + (s.rank ? ' · 班级第 ' + s.rank + '/' + s.n : ' · 未登记全班') + '</div></div>' +
          '<button class="btn xs" data-act="clsEdit" data-id="' + ex.id + '">全班成绩</button>' +
          '<button class="iconbtn del" data-act="examDel" data-id="' + ex.id + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/></svg></button></div>';
      }).join('') + '</div></div>';
  }

  /* 登记表单 */
  var gg = UI.study.g || g;
  h += '<div class="panel" style="margin-top:16px"><div class="phead"><h3 class="blk">登记一次考试</h3>' +
    '<span class="sub">' + esc(gg) + '共 ' + subjOf(gg).length + ' 门 · 满分 ' + fullOf(gg) + '</span></div><div class="form">' +
    '<div class="fld"><span>考试名称</span><input type="text" id="eName" placeholder="例如：高一下期中" data-enter="examAdd"></div>' +
    '<div class="fld"><span>日期</span><input type="date" id="eDate" value="' + today() + '"></div>' +
    '<div class="fld"><span>年级</span><select id="eGrade" data-chg="gradeChg"><option' + (gg === '高一' ? ' selected' : '') + '>高一</option><option' + (gg === '高二' ? ' selected' : '') + '>高二</option></select></div>' +
    '<div class="full"><div class="hair"></div><div class="subj">' + subjOf(gg).map(function (s) {
      return '<div class="fld"><span>' + s[0] + '（满分 ' + s[1] + '）</span><input type="number" id="es_' + s[0] + '" inputmode="decimal" step="0.5" max="' + s[1] + '" placeholder="0"></div>';
    }).join('') + '</div></div>' +
    '<div class="fld full"><span>全班成绩（每行一位同学，支持「姓名 总分」或只写总分；可从表格直接粘贴）</span>' +
    '<textarea id="eCls" placeholder="张三 812&#10;李四 795&#10;806"></textarea></div>' +
    '<div class="fld"><span>&nbsp;</span><button class="btn acc" data-act="examAdd">保存成绩</button></div></div></div>';
  h += '</div><aside class="study-side">' + renderUniBanner() + '</aside></div>';
  $('#v-study').innerHTML = h;
};

function priCls(p) { return p === '高' ? 'p1' : p === '中' ? 'p2' : 'p3'; }
RENDER.schedule = function () {
  var T = today(), mode = UI.sch.mode, nm = nowMin();
  var ovd = S.sch.filter(function (s) { return !s.done && s.date < T; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var wk = []; for (var i = 0; i < 7; i++) wk.push(shift(i));
  var pool = mode === 'today' ? S.sch.filter(function (s) { return s.date === T; })
    : mode === 'week' ? S.sch.filter(function (s) { return wk.indexOf(s.date) >= 0; })
      : S.sch.slice();
  pool.sort(function (a, b) { return (a.date + (a.time || '99:99')) < (b.date + (b.time || '99:99')) ? -1 : 1; });
  var dn = pool.filter(function (s) { return s.done; }).length;

  var h = '<div class="shead"><div><div class="kicker">Schedule</div><h1 class="stitle serif">日程统筹</h1>' +
    '<div class="sday">今日 / 本周 / 全部 · 昨天没做完的会自动顺延到今天</div></div>' +
    '<div class="hact"><div class="seg">' + [['today', '今日'], ['week', '本周'], ['all', '全部']].map(function (x) {
      return '<button data-act="schMode" data-m="' + x[0] + '" class="' + (mode === x[0] ? 'on' : '') + '">' + x[1] + '</button>';
    }).join('') + '</div></div></div>';

  if (ovd.length) {
    h += '<div class="panel" style="border-left:3px solid var(--red)"><div class="phead"><h3 class="blk red">逾期未完成 <span class="n">' + ovd.length + ' 项</span></h3>' +
      '<button class="btn xs" data-act="schRoll">全部顺延到今天</button></div><div class="rows">' +
      ovd.map(function (s) {
        return '<div class="rw ovd"><button class="tickbox" data-act="schDone" data-id="' + s.id + '"></button>' +
          '<div class="gr"><div class="t1 red">' + esc(s.title) + '</div><div class="t2">原定 ' + esc(s.date) + (s.time ? ' ' + esc(s.time) : '') + ' · ' + esc(s.cat) + '</div></div>' +
          '<span class="pri ' + priCls(s.pri) + '"><i></i>' + esc(s.pri) + '</span>' +
          '<button class="iconbtn del" data-act="schDel" data-id="' + s.id + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/></svg></button></div>';
      }).join('') + '</div></div>';
  }

  h += '<div class="panel' + (ovd.length ? '' : ' tint') + '" style="margin-top:16px"><div class="phead"><h3 class="blk">' +
    (mode === 'today' ? '今日安排' : mode === 'week' ? '未来 7 天' : '全部日程') + ' <span class="n">' + pool.length + ' 项</span></h3>' +
    '<div class="mini" style="min-width:170px"><span class="bar thin"><i style="width:' + pct(dn, pool.length) + '%;background:var(--sage)"></i></span><span class="pc">' + pct(dn, pool.length) + '%</span></div></div>';
  if (mode === 'week') {
    h += '<div class="week">' + wk.map(function (d) {
      var its = S.sch.filter(function (s) { return s.date === d; }).sort(function (a, b) { return t2m(a.time || '99:99') - t2m(b.time || '99:99'); });
      return '<div class="d' + (d === T ? ' tdy' : '') + '"><div class="dh">' + mdOf(d) + ' 周' + wdOf(d) + (its.length ? ' · ' + its.length : '') + '</div>' +
        its.map(function (s) { return '<div class="it' + (s.done ? ' dn' : '') + '" title="' + esc(s.title) + '">' + (s.time ? esc(s.time) + ' ' : '') + esc(s.title) + '</div>'; }).join('') + '</div>';
    }).join('') + '</div><div class="hair"></div>';
  }
  if (!pool.length) h += noData('这个范围内没有日程');
  else {
    h += '<div class="rows">' + pool.map(function (s) {
      var late = !s.done && s.date === T && s.time && t2m(s.time) < nm;
      return '<div class="rw' + (s.done ? ' done' : '') + '"><button class="tickbox' + (s.done ? ' on' : '') + '" data-act="schDone" data-id="' + s.id + '">' +
        (s.done ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '</button>' +
        '<div class="gr"><div class="t1">' + esc(s.title) + (late ? ' <span class="tag red">已过时间</span>' : '') + (s.d ? ' <span class="tag line">演示</span>' : '') + '</div>' +
        '<div class="t2">' + (s.date === T ? '今天' : mdOf(s.date) + ' 周' + wdOf(s.date)) + (s.time ? ' ' + esc(s.time) : '') + ' · ' + esc(s.cat) + '</div></div>' +
        '<span class="pri ' + priCls(s.pri) + '"><i></i>' + esc(s.pri) + '</span>' +
        '<button class="iconbtn del" data-act="schDel" data-id="' + s.id + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14M10 7V5h4v2M8 7l.7 12h6.6L16 7"/></svg></button></div>';
    }).join('') + '</div>';

    '<div class="fld"><span>时间（选填）</span><input type="time" id="sTime"></div>' +
    '<div class="fld"><span>分类</span><select id="sCat">' + SCH_CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><span>优先级</span><select id="sPri">' + PRIS.map(function (p) { return '<option' + (p === '中' ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><span>&nbsp;</span><button class="btn acc" data-act="schAdd">添加日程</button></div></div></div>';
  $('#v-schedule').innerHTML = h;
};

  var order = { '必买': 0, '很想要': 1, '想要': 2 };

    '<div class="stat"><div class="lb">待买</div><div class="vl">' + open.length + '<small>件</small></div></div>' +
    '<div class="stat"><div class="lb">预计支出</div><div class="vl">' + yuan0(amtOpen) + '</div></div>' +
    '<div class="stat"><div class="lb">本月已买</div><div class="vl">' + yuan0(amtM) + '</div></div>' +
    '<div class="stat"><div class="lb">必买项</div><div class="vl">' + open.filter(function (w) { return w.pri === '必买'; }).length + '<small>件</small></div></div>' +
    '</div><div class="hair"></div><div class="form">' +
    '<div class="fld wide"><span>物品</span><input type="text" id="wName" placeholder="例如：跑鞋" data-enter="wishAdd"></div>' +
    '<div class="fld"><span>预算（¥）</span><input type="number" id="wPrice" inputmode="decimal" placeholder="0" data-enter="wishAdd"></div>' +

    var el;

    } else if (p.type === 'area') {

      el.setAttribute('data-k', p.key);

    } else {
      el = document.createElement('input');
      el.type = 'text';

function cRenderSheet(tpl, data) {
  var sheet = document.getElementById('contractSheet'); if (!sheet) return [];
  var r = tplBuild(tpl.html, 'fill');
  sheet.innerHTML = '';
  Array.prototype.slice.call(r.node.childNodes).forEach(function (n) { sheet.appendChild(n); });
  var p = paperOf(tpl);
  sheet.style.setProperty('--pw', p.w + 'mm');
  sheet.style.setProperty('--ph', p.h + 'mm');
  if (data) cApplyData(sheet, data);
  return r.fields;
}
function cApplyData(root, d) {
  if (!d || !root) return;
  $$('[data-k]', root).forEach(function (el) {
    var k = el.getAttribute('data-k');
    if (!k || !(k in d)) return;
    var v = d[k];
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = v == null ? '' : v;
    else if (isChkEl(el)) { if (v) el.classList.add('on'); else el.classList.remove('on'); }
    else el.textContent = v == null ? '' : v;
  });
  var cks = d._cks || d._chks;
  if (cks) $$('[data-ck]', root).forEach(function (el) {
    var i = +el.getAttribute('data-ck');
    el.classList.toggle('on', !!cks[i]);
  });
  if (d._named) Object.keys(d._named).forEach(function (k) {
    var el = root.querySelector('.chk[data-k="' + cssq(k) + '"]');
    if (el && d._named[k]) el.classList.add('on');
  });
}
function cReadSheet() {
  var root = document.getElementById('contractSheet'), d = {};
  if (!root) return d;
  $$('[data-k]', root).forEach(function (el) {
    var k = el.getAttribute('data-k'); if (!k) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') d[k] = el.value;
    else if (isChkEl(el)) d[k] = el.classList.contains('on');
    else d[k] = el.textContent;
  });
  var cks = [];
  $$('[data-ck]', root).forEach(function (el) { cks[+el.getAttribute('data-ck')] = el.classList.contains('on'); });
  d._cks = cks;
  return d;
}
function cFieldValue(root, key) {
  var el = root.querySelector('[data-k="' + cssq(key) + '"]');
  if (!el) return '';
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return el.value;
  if (isChkEl(el)) return el.classList.contains('on');
  return el.textContent;
}
function cSetField(k, v) {
  var root = document.getElementById('contractSheet'); if (!root || !k) return;
  $$('[data-k]', root).forEach(function (el) {
    if (el.getAttribute('data-k') !== k) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = v == null ? '' : v;
    else if (isChkEl(el)) el.classList.toggle('on', !!v);
  });
}
function cRenderFields() {
  var box = document.getElementById('fillFields'), cnt = document.getElementById('fillFc');
  if (!box) return;
  var root = document.getElementById('contractSheet');
  var list = __fillFields || [];
  box.innerHTML = list.length ? list.map(function (f) {
    var v = root ? cFieldValue(root, f.key) : '';
    if (f.type === 'check') {
      return '<div class="ff" data-fk="' + esc(f.key) + '"><div class="ffck' + (v ? ' on' : '') + '" data-act="ffToggle" data-k="' + esc(f.key) + '"><i></i><span>' + esc(f.key) + '</span></div></div>';
    }
    var ctl = f.type === 'area'
      ? '<textarea data-ff="' + esc(f.key) + '" placeholder="' + esc(f.key) + '">' + esc(v) + '</textarea>'
      : '<input type="text" data-ff="' + esc(f.key) + '" value="' + esc(v) + '" placeholder="' + esc(f.key) + '">';
    return '<div class="ff" data-fk="' + esc(f.key) + '"><label><b>' + esc(f.key) + '</b>' + (f.n > 1 ? '<s>' + f.n + ' 处</s>' : '') + '</label>' + ctl + '</div>';
  }).join('') : '<div class="empty" style="margin:10px">该模板没有可填写字段<br><span style="font-size:11.5px">在编辑器里用 {{字段名}} 添加</span></div>';
  if (cnt) cnt.textContent = list.length + ' 项';
  var a = document.getElementById('cmTitle'), b = document.getElementById('cmParty'), c = document.getElementById('cmDate');
  if (a) a.value = __fillMeta.title || '';
  if (b) b.value = __fillMeta.party || '';
  if (c) c.value = __fillMeta.date || '';
}
function cMarkFF(k) {
  $$('.ff').forEach(function (el) { el.classList.toggle('act', el.getAttribute('data-fk') === k); });
}
function cStartFill(tpl, data, meta, recId) {
  if (!tpl) return;
  __fillTpl = tpl;
  __cEditing = recId ? (byId(__cList, recId) || null) : null;
  __fillMeta = meta || { title: '', party: '', date: '' };
  __fillZoom = null;

}
function cAutoScale() {
  var p = paperOf(__fillTpl);
  var sc = document.getElementById('cScroll');
  var avail = (sc ? sc.clientWidth : 720) - 28;
  return clamp(avail / mm2px(p.w), .28, 1.1);
}
function cFit() {
  if (!__fillTpl) return;
  var sh = document.getElementById('contractSheet'), fit = document.getElementById('cFit');
  if (!sh || !fit) return;
  var p = paperOf(__fillTpl);
