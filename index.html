}
function cAutoSave() {
  if (!__fillTpl) return;
  try {
    localStorage.setItem('wb_life_contract_draft', JSON.stringify({ tpl: __fillTpl.id, data: cReadSheet(), meta: __fillMeta, ts: Date.now() }));
  } catch (e) { }
}
function cAutoMeta() {
  var d = cReadSheet(), keys = Object.keys(d);
  var pick = function (pats) {
    for (var i = 0; i < pats.length; i++)
      for (var j = 0; j < keys.length; j++)

    return '';
  };
  __fillMeta.title = pick([/^合同编号$/, /合同编号/, /编号$/]) || pick([/乙方(公司|名称|单位)/, /客户名称/, /^乙方$/, /甲方(公司|名称)/, /标题/]);
  __fillMeta.party = pick([/乙方(公司|名称|单位)/, /客户名称/, /^乙方$/, /购货单位/, /买方/]) || pick([/甲方(公司|名称)/, /^甲方$/]);
  __fillMeta.date = pick([/签订日期/, /签署日期/, /签约日期/, /^日期$/, /日期/]);
  cRenderFields();
  toast(__fillMeta.title ? '已从合同内容识别归档信息' : '没有找到可识别的内容，请手动填写');

function cSaveContract(asNew) {

function cImport() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var obj = JSON.parse(String(rd.result)), items = [];
        if (obj.type === 'wb_life_contracts_v1' && Array.isArray(obj.list)) items = obj.list;
        else if (obj.type === 'wb_life_contract_v1' && obj.record) items = [obj.record];
        else throw new Error('文件格式不支持（缺少 type 字段）');
        if (!items.length) { toast('文件中没有合同记录', 'ok'); return; }
        if (!confirm('导入 ' + items.length + ' 条合同？已存在的编号将自动跳过。')) return;
        var added = 0, skip = 0;
        items.forEach(function (it) {
          if (!it.id) it.id = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          if (__cList.some(function (c) { return c.id === it.id || (c.no && it.no && c.no === it.no); })) { skip++; return; }
          __cList.push(it); added++;
        });
        cSaveList(); cRenderList();
        setStatus('导入：新增 ' + added + ' 条，跳过 ' + skip + ' 条');
      } catch (e) { toast('导入失败：' + e.message, 'bad'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

  return '<div class="ckkpis">' +
    '<div class="ckkpi"><i>报告份数</i><b>' + list.length + '</b><s>覆盖 ' + ny + ' 个年份</s></div>' +
    '<div class="ckkpi"><i>最近体检</i><b style="font-size:16px">' + (last ? esc(last.date) : '—') + '</b><s>' + (last ? (days <= 0 ? '就是今天' : '距今 ' + days + ' 天') : '还没有记录') + '</s></div>' +
    '<div class="ckkpi' + (abn ? ' warn' : '') + '"><i>最近异常项</i><b>' + abn + '</b><s>共 ' + tot + ' 项指标</s></div>' +

  window.__ckDraft = null;
  closeModal();
  UI.ck.tab = 'checkup';
  RENDER.habits();
  toast('已保存 ' + rep.items.length + ' 项指标', 'ok');
};
function ckUpsert(rep) {
  var exist = null;
  for (var i = 0; i < S.checkups.length; i++) {
    if (S.checkups[i].date === rep.date && (S.checkups[i].org || '') === (rep.org || '')) { exist = S.checkups[i]; break; }
  }
  if (exist) {
    var map = {};
    (exist.items || []).forEach(function (it) { map[it.n] = it; });
    rep.items.forEach(function (it) { map[it.n] = it; });
    exist.items = [];
    for (var k in map) exist.items.push(map[k]);
    if (rep.src) exist.src = rep.src;
    bump(); commit('已合并到 ' + rep.date + ' 的报告');
  } else {
    S.checkups.push({ id: uid(), date: rep.date, org: rep.org, person: rep.person || '', src: rep.src || '', items: rep.items, ts: Date.now() });
    bump(); commit('已保存 ' + rep.date + ' 的体检报告');
  }
}

acts.ckItemSave = function (t) {

  var vv = $('#ckIV').value.trim(), qv = ($('#ckIQ').value || '').trim();

  var def = ckFindDef(ckNorm(nm));
  var g = def ? def.d.g : '其他';
  var hit = (r.items || []).filter(function (x) { return x.n === t.dataset.k; })[0];
  var obj = {
    k: nm, n: nm, g: g,
    v: vv === '' ? null : parseFloat(vv),
    qv: vv === '' ? qv : '',
    u: ($('#ckIU').value || '').trim(),
    lo: lo === '' ? null : parseFloat(lo),
    hi: hi === '' ? null : parseFloat(hi),
    flag: 0
  };
  if (!hit) { r.items = r.items || []; r.items.push(obj); hit = obj; }
  else { for (var kk in obj) hit[kk] = obj[kk]; }
  hit.flag = 0;
  if (obj.v !== null && obj.lo !== null && obj.hi !== null && obj.hi !== obj.lo) {
    hit.flag = obj.v > obj.hi ? 1 : obj.v < obj.lo ? -1 : 0;
  }

acts.ckExport = function () {

  list.forEach(function (r) {
    (r.items || []).forEach(function (it) {
      var f = ckFlagOf(it);
      rows.push([r.date, r.org || '', it.g || '', it.n, ckValTxt(it), it.u || '',
      it.lo === null || it.lo === undefined ? '' : it.lo, it.hi === null || it.hi === undefined ? '' : it.hi,
      f === 'hi' ? '偏高' : f === 'lo' ? '偏低' : '正常']);

/* ---------- 拖拽上传 ---------- */
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var t = e.target && e.target.closest ? e.target.closest('#ckDrop') : null;
    if (!t) return;
    e.preventDefault();
    if (ev === 'dragover' || ev === 'dragenter') { t.style.borderColor = 'var(--accent)'; t.style.background = 'var(--accentbg)'; }
    else if (ev === 'dragleave') { t.style.borderColor = ''; t.style.background = ''; }
    else {
      t.style.borderColor = ''; t.style.background = '';
      var fs = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
      if (fs.length) ckImportFiles(fs);
    }
  });
});

window.addEventListener('storage', function (e) {

});
